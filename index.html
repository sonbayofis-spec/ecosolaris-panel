<style>
:root{
  --bg:#F2F6F4; --panel:#FFFFFF; --fg:#11292A; --muted:#5B7370; --line:#E1EAE7; --soft:#F5F9F7;
  --accent:#16806C; --accent-soft:#DDF0EA; --m2:#8A63C4; --m3:#3A78C2; --low:#C9811F; --bad:#B9472F; --good:#16806C;
  --hero:#E6F3EE; --hero2:#F4FAF7; --hill:#CFE6DC; --hill2:#BCDCCF;
  --blade:#FFFFFF; --blade-edge:#8EA7A0; --tower-a:#FFFFFF; --tower-b:#C5D6D1;
  --top:#0F2A2A; --top-fg:#E8F3F0; --top-muted:#93B2AB; --band:#16806C;
  --shadow:0 1px 2px rgba(17,41,42,.05),0 6px 18px -10px rgba(17,41,42,.18);
  --font-sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#091513; --panel:#10221F; --fg:#E3F0EC; --muted:#8FAAA4; --line:#1D3530; --soft:#0D1D1A;
    --accent:#45C7AB; --accent-soft:#123730; --m2:#B9A0EC; --m3:#86B6F2; --low:#E4A64F; --bad:#E88A75; --good:#45C7AB;
    --hero:#10302A; --hero2:#0C211D; --hill:#16403A; --hill2:#1B4B43;
    --blade:#E6F0ED; --blade-edge:#6F8D86; --tower-a:#D9E6E2; --tower-b:#8EA7A0;
    --top:#050E0C; --top-fg:#E3F0EC; --top-muted:#7E9D96; --band:#45C7AB;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#091513; --panel:#10221F; --fg:#E3F0EC; --muted:#8FAAA4; --line:#1D3530; --soft:#0D1D1A;
    --accent:#45C7AB; --accent-soft:#123730; --m2:#B9A0EC; --m3:#86B6F2; --low:#E4A64F; --bad:#E88A75; --good:#45C7AB;
    --hero:#10302A; --hero2:#0C211D; --hill:#16403A; --hill2:#1B4B43;
    --blade:#E6F0ED; --blade-edge:#6F8D86; --tower-a:#D9E6E2; --tower-b:#8EA7A0;
    --top:#050E0C; --top-fg:#E3F0EC; --top-muted:#7E9D96; --band:#45C7AB;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--top);z-index:30}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
/* top bar */
.top{background:var(--top);color:var(--top-fg);padding-block:12px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,#1F6F5C,#0F3D33);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.logo svg{width:22px;height:22px}
.brand b{display:block;font-weight:700;font-size:15.5px;letter-spacing:.005em;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--top-muted);font-weight:500}
.topr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:12.5px;color:var(--top-muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--top-muted);display:inline-block}
.status.live .dot{background:#45C7AB;box-shadow:0 0 0 3px rgba(69,199,171,.25)}
.status.warn .dot{background:#E4A64F;box-shadow:0 0 0 3px rgba(228,166,79,.3)}
.status b{color:var(--top-fg);font-weight:600}
.pill{font:inherit;font-size:12.5px;font-weight:600;color:var(--top-fg);text-decoration:none;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;white-space:nowrap;background:rgba(255,255,255,.04)}
.pill:hover{background:rgba(255,255,255,.1)}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:999px;overflow:hidden;padding:2px}
.lang button{font:inherit;font-size:12px;font-weight:700;color:var(--top-muted);background:transparent;border:0;border-radius:999px;padding:3px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--top-fg);color:var(--top)}
/* section nav */
.snav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.snav .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.snav .wrap::-webkit-scrollbar{display:none}
.snav button{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.snav button[hidden]{display:none}
.snav button svg{width:15px;height:15px;flex:none}
.snav button:hover{color:var(--fg);background:var(--panel)}
.snav button.on{color:var(--accent);background:var(--accent-soft)}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
section[id]{scroll-margin-top:64px}
/* hero */
.hero{position:relative;background:linear-gradient(165deg,var(--hero),var(--hero2));border-radius:20px;padding:30px 30px 26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,360px);gap:10px 24px;align-items:end;overflow:hidden;box-shadow:var(--shadow);min-height:240px}
.kick{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.kick i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.hero h1{margin:0 0 10px;font-size:clamp(25px,4.4vw,38px);line-height:1.12;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch;font-size:15.5px}
.hero p b{color:var(--fg);font-weight:700}
.chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.chip.mid{color:var(--low);border-color:color-mix(in srgb,var(--low) 55%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.scene{position:relative;align-self:stretch;margin:-30px -30px -26px 0;min-height:230px}
.scene svg{position:absolute;inset:auto 0 0 0;width:100%;height:100%;overflow:hidden}
.rotor{transform-box:fill-box;transform-origin:center}
.rpmt{font-family:var(--font-sans);font-size:12.5px;font-weight:700;fill:var(--muted)}
.rpm{position:absolute;left:4px;bottom:18px;text-align:left;line-height:1.2;background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--line);border-radius:12px;padding:7px 11px;backdrop-filter:blur(4px)}
.rpml{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rpm b{font-size:17px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border-radius:16px;padding:18px 18px 16px;min-width:0;box-shadow:var(--shadow);border:1px solid var(--line)}
.tile .l{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--muted)}
.ic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ic svg{width:17px;height:17px}
.tile .v{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:12px 0 4px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);font-weight:600;margin-left:5px;letter-spacing:0}
.tile .s{font-size:12.5px;color:var(--muted);line-height:1.5}
.tile input{font:inherit;font-size:12.5px;font-weight:600;width:64px;padding:2px 6px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--fg)}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0;box-shadow:var(--shadow)}
.panel h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.panel .d{margin:3px 0 14px;color:var(--muted);font-size:13.5px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 14px;flex-wrap:wrap}
.tabs{display:inline-flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{font:inherit;font-size:13px;font-weight:700;padding:5px 13px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,tr:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
#chart svg{width:100%;height:auto;overflow:visible;touch-action:pan-y}
#chart svg text,.rosebox svg text{font-family:var(--font-sans);font-size:11px;font-weight:600;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:7px;vertical-align:middle}
.legend i.band{height:10px;opacity:.22}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.three{display:grid;gap:10px}
.info{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px}
.info .tx{min-width:0}
.info b{display:block;font-size:14.5px;font-weight:700;margin-bottom:2px}
.info span{font-size:13.5px;color:var(--muted)}
.rosebox{display:flex;flex-direction:column;align-items:center;gap:6px}
.rosebox svg{max-width:240px;width:100%;height:auto;overflow:visible}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.day{font:inherit;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;color:var(--fg);min-width:0}
.day:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.day[aria-pressed="true"]{background:var(--panel);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.day .n{font-size:13px;font-weight:700}
.day .w{font-size:23px;margin:4px 0 0;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.day .w small{font-size:12px;color:var(--muted);font-weight:600}
.day .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .b{position:relative;height:6px;background:var(--line);border-radius:3px;margin-top:9px}
.day .b i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.day .b u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5}
.week{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.week b{color:var(--fg);font-weight:800;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{text-align:right;padding:8px 11px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;font-weight:700;letter-spacing:.01em;color:var(--muted);position:sticky;top:0;background:var(--soft)}
td{font-family:var(--font-mono);font-size:13px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
tr.sel td{background:var(--accent-soft)!important}
td.e{color:var(--accent);font-weight:500} td.i{color:var(--m2)} td.g{color:var(--m3)}
td.wet{color:var(--m3)}
.foot{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:7px;max-width:92ch;padding-inline:4px}
.foot b{color:var(--fg);font-weight:700}
.accm{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.accm .info{flex-direction:column;gap:2px}
.accm .info b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.accm .info.best{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel)}
table.acct{min-width:420px}
table.arct{min-width:600px}
.lv{font-size:11px;font-weight:700;color:var(--accent);margin-left:5px}
.guide summary{cursor:pointer;font-size:18px;font-weight:800;letter-spacing:-.01em;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";float:right;color:var(--muted);font-weight:600}
.guide[open] summary::after{content:"−"}
.gbody{margin-top:12px;font-size:13.5px;max-width:78ch}
.gbody p{margin:0 0 10px;color:var(--muted)}
.gbody h3{font-size:14px;font-weight:800;margin:16px 0 6px}
.gbody ul{margin:0;padding-left:18px;color:var(--muted)}
.gbody li{margin:4px 0}
.gbody b{color:var(--fg);font-weight:700}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;padding:22px 18px 18px;min-height:0;border-radius:18px}
  .scene{margin:4px -18px -18px;min-height:0;height:180px}
  .rpm{left:18px;bottom:16px;padding:6px 10px}.rpm b{font-size:15px}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:14px 13px;border-radius:14px}.tile .l{font-size:12px;gap:7px}.ic{width:26px;height:26px;border-radius:8px}.ic svg{width:15px;height:15px}
  .tile .v{font-size:25px;margin:9px 0 3px}.tile .v small{font-size:12px}.tile .s{font-size:11.5px}
  .panel{padding:18px 16px;border-radius:16px}
  .chips{display:inline-grid;grid-template-columns:auto;gap:8px}
  .chip{text-align:center}
  .xr{display:none}
  .top .wrap{gap:8px}
  .status{order:3;width:100%}
}
</style>

anki gücü.</li><li><b>24 saat üretim</b>: Ana tahmin (ECMWF). Altındaki iki aralıktan <i>modeller</i> üç modelin farkını, <i>saha belirsizliği dahil</i> ise saha katsayısının belirsizliğini de katar. Gerçek değer büyük olasılıkla ikinci aralıktadır.</li><li><b>Hava belirsizliği (P10–P90)</b>: ECMWF'in 51 ayrı hava senaryosu aynı hesaptan geçirilir. Üretimin yaklaşık %80 olasılıkla bu aralıkta kalması beklenir. Yalnızca hava tahmininin belirsizliğini gösterir; saha katsayısının belirsizliği ayrıdır ve bu aralığa dahil değildir.</li><li><b>Brüt satış</b>: MWh × sizin girdiğiniz fiyat. Bakım, sigorta, kredi ve vergi düşülmemiştir.</li><li><b>Kapasite kullanımı</b>: Üretimin türbinin tam gücüne (2 MW) oranı.</li></ul><h3>Grafik</h3><ul><li>Üstte rüzgâr hızı, altta türbin gücü. Kalın çizgi ECMWF (ana tahmin). Çizgiler birbirinden uzaksa belirsizlik yüksektir.</li><li>3,5 m/s altında türbin üretmez; 12 m/s civarında tam güce yaklaşır; 25 m/s üstünde güvenlik için durur.</li></ul><h3>Tablo ve diğer bölümler</h3><ul><li><b>Rotor eşdeğeri</b>: Rotorun 60–150 m aralığındaki enerji eşdeğeri hız. Güç bununla hesaplanır.</li><li>Günlük MWh %92 net verim içerir, bu yüzden saatlik kW toplamı yaklaşık %8 fazla görünür.</li><li><b>Tahmin ve gerçek üretim</b>: Gerçek üretim verisi girilince görünür.</li></ul><h3>Neye ne kadar güvenmeli?</h3><ul><li><b>Güvenilir:</b> hangi gün ve saatlerin rüzgârlı ya da sakin olduğu, bakım için sakin pencere, haftalık karşılaştırma.</li><li><b>Dikkatli olun:</b> kesin MWh ve lei rakamları (saha katsayısı ×1,14 ölçülmedi, aralığı baz alın). Yüksek güvenilirlik etiketi doğruluk anlamına gelmez.</li></ul>",trk_title:"Tahmin ve gerçek üretim",trk_desc:"Sabah kaydedilen gün öncesi tahmin, sayaçtan gelen gerçek üretimle saat saat karşılaştırılır. Hata, türbin kapasitesine (2 MW) oranlanır.",trk_act:"Gerçek (MWh)",trk_nmae:"kapasiteye göre saatlik ortalama hata",trk_bias:"toplam sapma",trk_note:"Sapma artıysa tahmin gerçek üretimden fazla çıkmış (bildirilen Cards</h3><ul><li><b>Wind</b>: Speed at 105 m and the turbine's power at that moment.</li><li><b>Output, next 24 h</b>: The main forecast (ECMWF). Of the two ranges below it, <i>models</i> is the spread between the three models, and <i>including site uncertainty</i> also adds the uncertainty of the site factor. The real value is most likely within the second range.</li><li><b>Weather uncertainty (P10–P90)</b>: ECMWF's 51 separate weather scenarios are run through the same calculation. Output is expected to fall in this range with about 80% probability. It shows only the forecast's own uncertainty; the site-factor uncertainty is separate and not included.</li><li><b>Gross sales</b>: MWh × the price you enter. Maintenance, insurance, loan and tax are not deducted.</li><li><b>Capacity use</b>: Output as a share of the turbine's full power (2 MW).</li></ul><h3>Chart</h3><ul><li>Wind speed on top, turbine power below. The thick line is ECMWF (main forecast). The further apart the lines, the higher the uncertainty.</li><li>Below 3.5 m/s the turbine does not produce; around 12 m/s it nears full power; above 25 m/s it stops for safety.</li></ul><h3>Table and other sections</h3><ul><li><b>Rotor-equivalent</b>: The energy-equivalent wind speed over the rotor (60–150 m). Power is calculated from it.</li><li>Daily MWh include 92% net efficiency, so hourly kW add up to about 8% more.</li><li><b>Forecast versus actual output</b>: Appears once real output data is entered.</li></ul><h3>What to trust, and how much</h3><ul><li><b>Reliable:</b> which days and hours are windy or calm, the calm window for maintenance, week-to-week comparison.</li><li><b>Be careful:</b> exact MWh and lei figures (the site factor ×1.14 has not been measured, so use the range). A high confidence label does not mean accuracy.</li></ul>",trk_title:"Forecast versus actual output",trk_desc:"The day-ahead forecast saved each morning is compared hour by hour with the output measured at the meter. Error is shown       f2:"<b>Site correction.</b> The models see the site on a 9–25 km grid and miss the speed-up over the Pojăreni ridge. Wind speeds are multiplied by 1.14. This factor makes ten years of ERA5 data give 4.65 GWh a year, the middle of our check against Global Wind Atlas, ERA5 and the turbine's real output at Tempelfelde. The factor is an estimate, not a measurement: an error of ±0.05 changes output by about 14%. The output card therefore also shows ×1.05 and ×1.25 scenarios.",

      days:["Dum","Lun","Mar","Mie","Joi","Vin","Sâm"],mon:["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","noi","dec"],
      month:["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"],
      c16:["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSV","SV","VSV","V","VNV","NV","NNV"],c8:["N","NE","E","SE","S","SV","V","NV"],
      brand:"Panou eolian Ecosolaris",tile_rev_day:"Vânzări brute estimate, {d}",tile_rev_sub:"producție estimată {e} MWh · modele {lo}–{hi} lei",dfull:["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"],kick:"Prognoza vântului la 105 m · ECMWF, ICON, GFS",nav_sum:"Rezumat",nav_chart:"Grafic",nav_week:"7 zile",nav_acc:"Precizie",nav_hours:"Pe ore",nav_arc:"Arhivă",arc_title:"Arhivă",arc_desc:"Zilele trecute: prognoza salvată dimineața, prețul OPEM pe ziua următoare și, după introducere, producția reală. Prognoza se salvează zilnic înainte de închiderea ofertelor, la 09:30. Azi și mâine arată proiecția live a panoului.",arc_live:"live",arc_wait:"în așteptare",arc_fc:"Prognoză (MWh)",arc_act:"Real (MWh)",arc_diff:"Dif.",arc_px:"OPEM (lei/kWh)",arc_rev:"Venit OPEM (lei)",arc_m_days:"Prognoze salvate",arc_u_days:"zile",arc_m_fc:"Prognoză totală",arc_s_fc:"ECMWF, zilele salvate",arc_m_act:"Real vs prognoză",arc_s_act:"{n} zile, real {v} MWh",arc_s_noact:"producția reală nu a fost încă introdusă",arc_pu:"Prețuri OPEM, ultima actualizare: {t}.",arc_late:"* salvată după închiderea ofertelor (09:30)",csv:"Descarcă CSV",th_temp:"Temp.",th_prec:"Precip.",csv_h:["Data ora","ECMWF 105 m (m/s)","ICON 105 m (m/s)","GFS 105 m (m/s)","Echivalent rotor (m/s)","Putere ECMWF (kW)","Direcție (°)","Temperatură (°C)","Precipitații (mm)"],windy:"Deschide în Windy",rpm_u:"rot/min",rpm_stop:"oprită",rpm_l:"Rotor",tile_e_sc:"cu incertitudinea amplasamentului: {lo}–{hi} MWh",wk_sc:"cu incertitudinea amplasamentului <b>{lo}–{hi}</b>",guide_title:"Cum citesc panoul?",guide_body:"<p>Acest panou este o <b>prognoză meteo</b>, nu o măsurătoare. Cifrele reprezintă ce se așteaptă modelele meteo, nu producția reală a turbinei.</p><h3>Rezumatul de sus</h3><ul><li><b>% dintr-o zi normală</b>: Cum se compară producția pe 24 de ore cu o zi normală a lunii (media 2015–2024).</li><li><b>Încredere în prognoză</b>: Cât de apropiate sunt cele trei modele (ECMWF, ICON, GFS). Arată acordul, nu exactitatea; toate trei pot greși împreună.</li></ul><h3>Cardurile</h3><ul><li><b>Vânt</b>: Viteza la 105 m și puterea turbinei în acel moment.</li><li><b>Producție, 24 h</b>: Prognoza principală (ECMWF). Din cele două intervale de dedesubt, <i>modele</i> este diferența dintre cele trei modele, iar <i>cu incertitudinea amplasamentului</i> adaugă și incertitudinea factorului de amplasament. Valoarea reală se află cel mai probabil în al doilea interval.</li><li><b>Incertitudine meteo (P10–P90)</b>: Cele 51 de scenarii meteo ECMWF sunt trecute prin același calcul. Producția se așteaptă să se încadreze în acest interval cu o probabilitate de circa 80%. Arată doar incertitudinea prognozei meteo; incertitudinea factorului de amplasament este separată și nu este inclusă.</li><li><b>Vânzări brute</b>: MWh × prețul introdus de dumneavoastră. Mentenanța, asigurarea, creditul și impozitele nu sunt scăzute.</li><li><b>Utilizarea capacității</b>: Producția ca pondere din puterea maximă a turbinei (2 MW).</li></ul><h3>Graficul</h3><ul><li>Sus viteza vântului, jos puterea turbinei. Linia groasă este ECMWF (prognoza principală). Cu cât liniile sunt mai depărtate, cu atât incertitudinea este mai mare.</li><li>Sub 3,5 m/s turbina nu produce; în jur de 12 m/s se apropie de puterea maximă; peste 25 m/s se oprește pentru siguranță.</li></ul><h3>Tabelul și celelalte secțiuni</h3><ul><li><b>Echivalent rotor</b>: Viteza echivalentă energetic pe rotor (60–150 m). Puterea se calculează din ea.</li><li>MWh zilnici includ un randament net de 92%, de aceea suma kW orari pare cu circa 8% mai mare.</li><li><b>Prognoză față de producția reală</b>: Apare după introducerea datelor reale de producție.</li></ul><h3>În ce să aveți încredere și cât</h3><ul><li><b>De încredere:</b> care zile și ore sunt cu vânt sau calme, fereastra liniștită pentru mentenanță, compararea săptămânilor.</li><li><b>Atenție:</b> cifrele exacte de MWh și lei (factorul de amplasament ×1,14 nu a fost măsurat, folosiți intervalul). O e     if(sel>=from&&sel<to){
      s+='<line x1="'+X(sel)+'" x2="'+X(sel)+'" y1="'+m.t+'" y2="'+(y0+bh)+'" stroke="var(--fg)" stroke-width="1" opacity=".45"/>';
      s+='<circle cx="'+X(sel)+'" cy="'+Yw(C.e.hub[sel]||0)+'" r="4.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>';
      var tx=X(sel),anc=tx>W*0.66?"end":"start",off=tx>W*0.66?-8:8;
      s+='<text x="'+(tx+off)+'" y="'+(m.t+10)+'" text-anchor="'+anc+'" style="fill:var(--fg)">'+dayLabel(sel)+' '+hh(sel)+' · '+fmt(C.e.hub[sel],1)+' m/s · '+fmt(C.e.kw[sel],0)+' kW</text>';
    }
    s+='<rect x="'+m.l+'" y="0" width="'+iw+'" height="'+H+'" fill="transparent"/></svg>';
    el.innerHTML=s;
    var svg=$("svg");
    function pick(ev){var rc=svg.getBoundingClientRect(),x=(ev.clientX-rc.left)/rc.width*W,ii=Math.round(from+(x-m.l)/iw*(n-1));ii=clamp(ii,from,to-1);if(ii!==sel){sel=ii;var di=DAYS.findIndex(function(d){return d.idx.indexOf(ii)>=0});if(di>=0&&di!==dayIdx){dayIdx=di;days();table();rose()}renderSel()}}
    svg.addEventListener("pointermove",function(e){if(e.pointerType==="mouse")pick(e)});
    svg.addEventListener("click",pick);
  }
  function renderSel(){tiles();hero();chart();Array.prototype.forEach.call($("rows").querySelectorAll("tr"),function(tr){tr.className=(+tr.getAttribute("data-i")===sel)?"sel":""});Array.prototype.forEach.call($("days").querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",String(+b.getAttribute("data-d")===dayIdx))})}
  var ACC=EMBED_ACC;
  function renderAcc(){
    var nb=document.querySelector('[data-go="s-acc"]');
    if(!SHOWACC||!ACC||!ACC.days||!ACC.days.length){$("s-acc").hidden=true;if(nb)nb.hidden=true;return}
    $("s-acc").hidden=false;if(nb)nb.hidden=false;var nm={e:"ECMWF",i:"ICON",g:"GFS"},h="";
    ["e","i","g"].forEach(function(m){var x=ACC.summary&&ACC.summary[m];if(!x)return;
      h+='<div class="info'+(ACC.best===m?' best':'')+'"><span>'+nm[m]+(ACC.best===m?' · '+t("acc_best"):'')+'</span><b>'+(function(){var v=(x.bias>0?"+":x.bias<0?"−":"")+fmt(Math.abs(x.bias),0);return LANG==="tr"?"%"+v:v+"%"})()+'</b><span>'+t("acc_bias")+' · '+t("acc_mae",{v:fmt(x.mae,1)})+'</span></div>'});
    $("acc-m").innerHTML=h;
    $("acc-rows").innerHTML=ACC.days.slice().reverse().map(function(d){var p=parseT(d.date+"T00:00");var c=function(v){return v==null?"–":fmt(v,1)};
      return '<tr><td>'+L().days[wd(d.date+"T00:00")]+" "+p.d+" "+L().mon[p.mo]+'</td><td><b>'+c(d.obs)+'</b></td><td class="e">'+c(d.e)+'</td><td class="i">'+c(d.i)+'</td><td class="g">'+c(d.g)+'</td></tr>'}).join("");
    $("acc-note").textContent=t("acc_note",{t:stamp(ACC.updated)});
  }
  var TRK=null;
  function renderTrk(){
    var s=$("s-trk");if(!s)return;
    if(!TRK||!TRK.hours||!TRK.days||!TRK.days.length){s.hidden=true;return}
    s.hidden=false;var nm={e:"ECMWF",i:"ICON",g:"GFS"},h="";
    var pc=function(v,d,sign){if(v==null)return "–";var x=(sign?(v>0?"+":v<0?"−":""):"")+fmt(Math.abs(v),d);return LANG==="tr"?"%"+x:x+"%"};
    ["e","i","g"].forEach(function(m){var x=TRK.summary&&TRK.summary[m];if(!x)return;
      h+='<div class="info'+(TRK.best===m?' best':'')+'"><span>'+nm[m]+(TRK.best===m?' · '+t("acc_best"):'')+'</span><b>'+pc(x.nmae_pct,1)+'</b><span>'+t("trk_nmae")+' · '+t("trk_bias")+' '+pc(x.bias_pct,1,true)+'</span></div>'});
    $("trk-m").innerHTML=h;
    var c=function(v){return v==null?"–":fmt(v,2)};
    $("trk-rows").innerHTML=TRK.days.slice().reverse().map(function(d){var p=parseT(d.date+"T00:00");
      return '<tr><td>'+L().days[wd(d.date+"T00:00")]+" "+p.d+" "+L().mon[p.mo]+'</td><td><b>'+c(d.actual_mwh)+'</b></td><td class="e">'+c(d.e)+'</td><td class="i">'+c(d.i)+'</td><td class="g">'+c(d.g)+'</td></tr>'}).join("");
    var note=t("trk_note",{n:TRK.hours,t:stamp(TRK.updated)});
    if(TRK.ref_cost&&TRK.ref_cost.hours>0)note+=" "+t("trk_ref",{v:fmt(TRK.ref_cost.cost_mdl,0)});
    $("trk-note").textContent=note;
  }
  function loadTrk(){
    if(typeof fetch!=="function")return;
    fetch("tracking.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){TRK=j;renderTrk();renderArc()}).catch(function(){});
  }
  function loadAcc(){
    if(typeof fetch!=="function")return;
    fetch("accuracy.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){ACC=j;renderAcc()}).catch(function(){});
  }
  // Arşiv: geçmiş günlerin kayıtlı tahmini (data/forecast), OPEM gün öncesi fiyatı (data/prices) ve varsa gerçek üretim (tracking.json).
  var ARC=null,ARCL=false,ARC_FIRST="2026-10-23",ARC_FIRST_F="2026-10-27"; // ilk fiyat ve ilk tahmin kaydının günü
  function isoShift(d,k){var p=d.split("-").map(Number),x=new Date(Date.UTC(p[0],p[1]-1,p[2]+k));return x.getUTCFullYear()+"-"+pad(x.getUTCMonth()+1)+"-"+pad(x.getUTCDate())}
  function loadArc(){
    if(typeof fetch!=="function"||!T||!T.length)return;
    var days=[],d=isoShift(T[NOW].slice(0,10),1);
    while(d>=ARC_FIRST&&days.length<60){days.push(d);d=isoShift(d,-1)}
    var get=function(u){return fetch(u,{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})};
    Promise.all(days.map(function(d){return Promise.all([d>=ARC_FIRST_F?get("data/forecast/"+d+".json"):null,get("data/prices/"+d+".json")]).then(function(r){return {date:d,f:r[0],p:r[1]}})})).then(function(a){ARC=a.filter(function(x){return x.f||x.p});renderArc()});
  }
  function arcFc(f){if(!f||!f.kw||!f.kw.e||f.kw.e.length!==24)return null;var s=0;f.kw.e.forEach(function(v){s+=v||0});return s/1000*(f.net||CFG.net)}
  function renderArc(){
    var s=$("s-arc");if(!s)return;
    var nb=document.querySelector('#snav [data-go="s-arc"]'); // veri yoksa menüde ölü düğme kalmasın
    if(!ARC||!ARC.length){s.hidden=true;if(nb)nb.hidden=true;return}
    s.hidden=false;if(nb)nb.hidden=false;
    var act={},n=0,sf=0,na=0,sa=0,sfa=0,late=false,rows="";
    if(TRK&&TRK.days)TRK.days.forEach(function(d){if(d.actual_mwh!=null)act[d.date]=d.actual_mwh});
    var pc=function(v,d,sign){if(v==null||!isFinite(v))return "–";var x=(sign?(v>0?"+":v<0?"−":""):"")+fmt(Math.abs(v),d);return LANG==="tr"?"%"+x:x+"%"};
    // Bugün ve yarın: kayıtlı tahmin yerine panelin canlı ECMWF projeksiyonu (saatlik yenilenir); geçmiş günler sabah kaydından gelir.
    var live={},list=ARC.slice();
    if(D){
      var td=T[NOW].slice(0,10),tm=isoShift(td,1);
      DAYS.forEach(function(dd){var k=T[dd.idx[0]].slice(0,10);if((k===td||k===tm)&&dd.idx.length===24)live[k]=dd});
      [td,tm].forEach(function(k){if(live[k]&&!list.some(function(x){return x.date===k}))list.push({date:k,f:null,p:null})});
      list.sort(function(a,b){return a.date<b.date?1:-1});
    }
    list.forEach(function(x){
      var lv=live[x.date],fm=lv?energy("e",lv.idx[0],lv.idx[lv.idx.length-1]+1):arcFc(x.f),pr=x.p&&x.p.length===24&&x.p.every(function(v){return v!=null&&isFinite(v)})?x.p:null,a=act[x.date],px=null,rv=null,df=null;
      if(fm==null&&!pr)return;
      if(fm!=null&&!lv){n++;sf+=fm}
      if(pr)px=pr.reduce(function(u,v){return u+v},0)/24/1000;
      if(pr&&fm!=null){rv=0;if(lv)lv.idx.forEach(function(ix){rv+=(C.e.kw[ix]||0)/1000*CFG.net*pr[+T[ix].slice(11,13)]});else for(var i=0;i<24;i++)rv+=(x.f.kw.e[i]||0)/1000*(x.f.net||CFG.net)*pr[i]}
      if(a!=null&&fm>0&&!lv){df=(a-fm)/fm*100;na++;sa+=a;sfa+=fm}
      if(x.f&&x.f.late&&!lv)late=true;
      var p=parseT(x.date+"T00:00"),w=lv?t("arc_wait"):"–";
      rows+='<tr><td>'+L().days[wd(x.date+"T00:00")]+" "+p.d+" "+L().mon[p.mo]+(x.f&&x.f.late&&!lv?"*":"")+'</td><td class="e">'+(fm==null?"–":fmt(fm,1))+(lv?'<span class="lv">'+t("arc_live")+'</span>':"")+'</td><td><b>'+(a==null?"–":fmt(a,1))+'</b></td><td>'+pc(df,0,true)+'</td><td>'+(px==null?w:fmt(px,2))+'</td><td>'+(rv==null?w:fmt(rv,0))+'</td></tr>';
    });
    var tot=na&&sfa>0?(sa-sfa)/sfa*100:null;
    $("arc-m").innerHTML='<div class="info"><span>'+t("arc_m_days")+'</span><b>'+fmt(n,0)+'</b><span>'+t("arc_u_days")+'</span></div>'+
      '<div class="info"><span>'+t("arc_m_fc")+'</span><b>'+fmt(sf,1)+' MWh</b><span>'+t("arc_s_fc")+'</span></div>'+
      '<div class="info"><span>'+t("arc_m_act")+'</span><b>'+pc(tot,1,true)+'</b><span>'+(na?t("arc_s_act",{n:na,v:fmt(sa,1)}):t("arc_s_noact"))+'</span></div>';
    $("arc-rows").innerHTML=rows;
    var pu=PRICES&&PRICES.updated?t("arc_pu",{t:stamp(PRICES.updated)}):"";
    $("arc-note").textContent=pu+(late?(pu?" ":"")+t("arc_late"):"");
  }
  function csv(){
    if(!D)return;var dec=LANG==="en"?".":",",sep=";";
    function n(v,d){return v==null||!isFinite(v)?"":v.toFixed(d).replace(".",dec)}
    var L2=[t("csv_h").join(sep)];
    for(var i=0;i<N;i++)L2.push([T[i].replace("T"," "),n(C.e.hub[i],2),C.i?n(C.i.hub[i],2):"",C.g?n(C.g.hub[i],2):"",n(C.e.rew[i],2),n(C.e.kw[i],0),C.e.dir[i]!=null?Math.round(C.e.dir[i]):"",n(C.e.temp[i],1),n(C.e.prec[i]!=null?Math.max(0,C.e.prec[i]):null,1)].join(sep));
    var blob=new Blob(["\ufeff"+L2.join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="ecosolaris_tahmin_"+T[0].slice(0,10)+".csv";document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  }
  $("csv").addEventListener("click",csv);
  Array.prototype.forEach.call($("snav").querySelectorAll("button"),function(b){b.addEventListener("click",function(){var el=$(b.getAttribute("data-go"));if(el&&!el.hidden)el.scrollIntoView({behavior:"smooth",block:"start"})})});
  (function(){
    if(typeof IntersectionObserver==="undefined")return;
    var vis={};var io=new IntersectionObserver(function(es){es.forEach(function(e){vis[e.target.id]=e.isIntersecting?e.intersectionRatio:0});
      var best=null,bv=0;Object.keys(vis).forEach(function(k){if(vis[k]>bv){bv=vis[k];best=k}});
      Array.prototype.forEach.call($("snav").querySelectorAll("button"),function(b){b.classList.toggle("on",b.getAttribute("data-go")===best)})},{threshold:[0,.15,.3,.5,.75,1],rootMargin:"-60px 0px -35% 0px"});
    ["s-sum","s-chart","s-week","s-acc","s-hours","s-arc"].forEach(function(id){io.observe($(id))});
  })();
  function renderAll(){applyStatic();status();renderAcc();renderTrk();renderArc();if(!D)return;tabs();hero();tiles();three();days();table();rose();chart()}

  Array.prototype.forEach.call($("lang").querySelectorAll("button"),function(b){
    b.addEventListener("click",function(){
      LANG=b.getAttribute("data-l");
      try{localStorage.setItem("eco_lang",LANG)}catch(e){}
      try{history.replaceState(null,"",LANG==="tr"?location.pathname+location.search:"#"+LANG)}catch(e){}
      renderAll();
    });
  });
  window.addEventListener("hashchange",function(){var h=location.hash.replace("#","").toLowerCase();if(I18N[h]&&h!==LANG){LANG=h;renderAll()}});

  function useData(d,live,fetched){
    D=d;T=d.time;LIVE=live;FETCHED=fetched;compute();findNow();
    sel=NOW;dayIdx=Math.max(0,DAYS.findIndex(function(x){return x.idx.indexOf(NOW)>=0}));
    renderAll();
  }
  function fromEmbed(E){
    var tt=[],p=parseT(E.start),base=Date.UTC(p.y,p.mo,p.d,p.h);
    for(var i=0;i<E.e["100m"].length;i++){var dt=new Date(base+i*3600e3);tt.push(dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-"+pad(dt.getUTCDate())+"T"+pad(dt.getUTCHours())+":00")}
    return {time:tt,e:E.e,i:E.i,g:E.g};
  }
  function fromApi(j){
    var h=j.hourly,map={e:"ecmwf_ifs025",i:"icon_seamless",g:"gfs_seamless"},o={time:h.time};
    MODELS.forEach(function(m){var x={};["10m","80m","100m","120m","180m"].forEach(function(l){var a=h["wind_speed_"+l+"_"+map[m]];if(a&&a.some(function(v){return v!=null}))x[l]=a});x.dir=h["wind_direction_100m_"+map[m]]||[];x.temp=h["temperature_2m_"+map[m]]||[];x.prec=h["precipitation_"+map[m]]||[];if(x["100m"])o[m]=x});
    if(!o.e)throw new Error("no ECMWF");
    return o;
  }
  // Gelen veri mantıklı mı? Uzunluklar, rüzgâr 0–60 m/s, sıcaklık −50…50 °C, ECMWF 100 m değerlerinin %90'ı dolu.
  function validApi(o){
    var n=o.time.length,ok=n>=48;
    ["e","i","g"].forEach(function(m){var x=o[m];if(!x)return;
      ["10m","80m","100m","120m","180m"].forEach(function(l){var a=x[l];if(!a)return;if(a.length!==n){ok=false;return}for(var i=0;i<n;i++){var v=a[i];if(v!=null&&!(v>=0&&v<=60))ok=false}});
      (x.temp||[]).forEach(function(v){if(v!=null&&!(v>-50&&v<50))ok=false});
    });
    var e100=o.e["100m"]||[],c=0,k=Math.min(72,n);for(var i=0;i<k;i++)if(e100[i]!=null)c++;
    return ok&&c>=k*0.9;
  }
  function load(){
    if(typeof fetch!=="function")return;
    var ctl=typeof AbortController!=="undefined"?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},12000);
    fetch(CFG.url,{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
      clearTimeout(tm);var d=fromApi(j);if(!validApi(d))throw new Error("bad");
      LAST=Date.now();FAILED=false;BAD=false;useData(d,true,wallNow());loadEns();if(!ARCL){ARCL=true;loadArc()}
    }).catch(function(e){clearTimeout(tm);FAILED=true;BAD=!!(e&&e.message==="bad");status()});
  }

  applyStatic();
  if(EMBED)useData(fromEmbed(EMBED),false,EMBED.fetched);
  load();loadAcc();loadTrk();loadPrices();
  setInterval(load,60*60*1000);
  setInterval(function(){if(!D)return;var o=NOW;findNow();if(o!==NOW){if(sel===o)sel=NOW;renderAll()}},60*1000);
  var tmr;window.addEventListener("resize",function(){clearTimeout(tmr);tmr=setTimeout(function(){if(D)chart()},120)});
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&Date.now()-LAST>15*60*1000)load()});
})();
</script>
