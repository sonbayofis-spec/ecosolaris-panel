name: Tahmin doğruluğu

on:
  schedule:
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dogruluk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dünün tahminini ölçümle karşılaştır
        run: python accuracy.py
      - name: Sonucu kaydet
        run: |
          git config user.name "ecosolaris-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accuracy.json
          git diff --staged --quiet || (git commit -m "Günlük tahmin doğruluğu" && git push)
