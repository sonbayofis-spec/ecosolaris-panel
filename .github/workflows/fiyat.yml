name: OPEM fiyatları

# OPEM ertesi gün için gün öncesi (PZU) fiyatlarını ≈09:40 Moldova saatinde yayınlar.
# Kışın (UTC+2) 07:35 UTC = 09:35; 07:35–09:05 arası dört kontrol fiyatı yayınlanır yayınlanmaz panele taşır
# (değişiklik yoksa commit atılmaz). 11:30 UTC gecikmeye karşı yedektir.
on:
  schedule:
    - cron: "35 7 * * *"
    - cron: "50 7 * * *"
    - cron: "20 8 * * *"
    - cron: "5 9 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fiyat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OPEM fiyatlarını indir
        run: python prices.py
      - name: Sonucu kaydet
        if: always()
        run: |
          mkdir -p data
          git config user.name "ecosolaris-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/prices prices.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "OPEM fiyatları" && git pull --rebase && git push)
